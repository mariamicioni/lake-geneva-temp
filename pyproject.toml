[project]
name = "lakegeneva"
version = "0.1.0"
description = "Next-day water temperature forecast for Lake Geneva at Geneva"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakegeneva"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
