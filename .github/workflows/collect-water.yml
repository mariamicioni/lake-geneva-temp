name: Collect raw data

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write           # needed to upload files to the release

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the last 7 days from existenz.ch
        run: python src/lakegeneva/features/ingest_water.py --days 7 --out raw

      - name: Save the current weather forecast from Open-Meteo
        if: always()            # still runs if the water download failed
        run: python src/lakegeneva/features/ingest_weather.py --out raw

      - name: Upload the snapshots to the raw-data release
        if: always()            # upload whatever was downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view raw-data > /dev/null 2>&1 || gh release create raw-data \
            --title "Raw data" \
            --notes "Daily raw snapshots: BAFU station 2606 via existenz.ch and the Open-Meteo forecast for Geneva. Backup until the feature store on GCS is set up." \
            --latest=false
          gh release upload raw-data raw/*.csv --clobber
