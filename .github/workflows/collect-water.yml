# Daily data collection: downloads the newest water readings and saves today's
# weather forecast, before the 18:00 cutoff of the forecast. Runs on GitHub's
# machines on a schedule, so it does not depend on my laptop being on.
# Temporary (MS1): the files go to a GitHub Release as a backup. From MS2 the
# feature pipeline writes to Google Cloud Storage with DVC instead.
name: Collect raw data

on:
  schedule:
    # Cron format: minute hour day-of-month month day-of-week, always in UTC.
    # Note: GitHub can start scheduled runs late when it is busy.
    - cron: "47 15 * * *"  # every day at 15:47 UTC (17:47 Swiss summer time, 16:47 winter time), before the 18:00 cutoff
  workflow_dispatch:        # allows a manual run from the Actions tab

# The job needs write access to the repository to upload files to a release.
permissions:
  contents: write           # needed to upload files to the release

jobs:
  collect:
    runs-on: ubuntu-latest  # a fresh Linux machine from GitHub, deleted after the run
    steps:
      # 1. Copy the repository onto the machine (to get the scripts).
      - uses: actions/checkout@v4

      # 2. Install Python. The scripts only use the standard library, so no
      #    packages are needed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Water: 10-minute readings of the last 7 days. The overlap with earlier
      #    runs is on purpose, so a missed day is filled in by the next run.
      #    If existenz.ch does not answer, the script takes the same readings
      #    from the official BAFU Data Platform (see "using the BAFU" in the log).
      - name: Download the last 7 days from existenz.ch (BAFU as fallback)
        run: python src/lakegeneva/features/ingest_water.py --days 7 --out raw

      # 4. Weather: today's forecast for the next 3 days, as known right now.
      - name: Save the current weather forecast from Open-Meteo
        if: always()            # still runs if the water download failed
        run: python src/lakegeneva/features/ingest_weather.py --out raw

      # 5. Upload the CSVs to the release "raw-data" (created on the first run).
      #    A release stores files outside the Git history, so data never ends up
      #    in Git. GH_TOKEN is a temporary key that GitHub creates for each run;
      #    it is not a secret stored in the repository.
      - name: Upload the snapshots to the raw-data release
        if: always()            # upload whatever was downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view raw-data > /dev/null 2>&1 || gh release create raw-data \
            --title "Raw data" \
            --notes "Daily raw snapshots: BAFU station 2606 via existenz.ch and the Open-Meteo forecast for Geneva. Backup until the feature store on GCS is set up." \
            --latest=false
          gh release upload raw-data raw/*.csv --clobber
